_format_version: "2.1"
_transform: true

###
# Routes incoming HTTP traffic to the right Supabase service. The string
# placeholders below ($SUPABASE_ANON_KEY / $SUPABASE_SERVICE_KEY) are
# expanded at container start by the kong service's `sed` entrypoint
# (see docker-compose*.yml) so the same file works in dev / e2e / coolify.
#
# Pinnwand runs no Edge Functions, so there is no functions-v1 route here.
###

consumers:
  - username: anon
    keyauth_credentials:
      - key: $SUPABASE_ANON_KEY
  - username: service_role
    keyauth_credentials:
      - key: $SUPABASE_SERVICE_KEY

acls:
  - consumer: anon
    group: anon
  - consumer: service_role
    group: admin

services:
  - name: auth-v1
    _comment: "GoTrue: /auth/v1/* -> auth:9999"
    url: http://auth:9999/
    routes:
      - name: auth-v1-all
        strip_path: true
        paths:
          - /auth/v1/
    plugins:
      - name: cors

  - name: rest-v1
    _comment: "PostgREST: /rest/v1/* -> rest:3000"
    url: http://rest:3000/
    routes:
      - name: rest-v1-all
        strip_path: true
        paths:
          - /rest/v1/
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon

  - name: realtime-v1
    # Hostname intentionally has a `.`; realtime v2 derives the tenant
    # `external_id` from the first dot-separated label of the upstream Host
    # header, so the container name + this URL together pin tenant lookup
    # to `realtime-dev` (the value `SEED_SELF_HOST=true` seeds into
    # `_realtime.tenants.external_id`). Without the `.`, the Host header is
    # bare `realtime:4000` and the broker rejects every subscription with
    # `TenantNotFound: realtime`.
    _comment: "Realtime: /realtime/v1/* -> realtime-dev.supabase-realtime:4000"
    url: http://realtime-dev.supabase-realtime:4000/socket/
    routes:
      - name: realtime-v1-all
        strip_path: true
        paths:
          - /realtime/v1/
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon

  - name: meta
    _comment: "postgres-meta: /pg/* -> meta:8080 - dev only, not exposed in coolify"
    url: http://meta:8080/
    routes:
      - name: meta-all
        strip_path: true
        paths:
          - /pg/
    plugins:
      - name: key-auth
        config:
          hide_credentials: false
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
