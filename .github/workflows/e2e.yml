name: E2E

# Nightly full cross-browser matrix (chromium + mobile-chromium + mobile-webkit)
# plus an on-demand run. The PR/push gate runs chromium only and lives in the
# CI workflow's `e2e` job, wired into the required `CI Pass` check, so e2e is
# not double-run on every PR.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.18.0"

jobs:
  e2e:
    name: Playwright (containers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Expose GitHub Actions runtime to BuildKit
        uses: crazy-max/ghaction-github-runtime@3cb05d89e1f492524af3d41a1c98c83bc3025124 # v3

      - name: Build & start infrastructure
        env:
          COMPOSE_BAKE: "true"
        run: pnpm e2e:up

      # No project filter: run the full cross-browser matrix. The chromium-only
      # PR gate lives in the CI workflow's e2e job.
      - name: Run Playwright (full matrix)
        run: pnpm e2e:test

      - name: Dump container logs on failure
        if: failure()
        run: pnpm e2e:logs

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 1

      - name: Upload Playwright traces & artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 1
