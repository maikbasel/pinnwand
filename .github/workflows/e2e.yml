name: E2E

# Nightly full cross-browser matrix (chromium + mobile-chromium + mobile-webkit)
# plus an on-demand run. The PR/push gate runs chromium only and lives in the
# CI workflow's `e2e` job, wired into the required `CI Pass` check, so e2e is
# not double-run on every PR.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.18.0"

jobs:
  e2e:
    name: Playwright (containers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Expose GitHub Actions runtime to BuildKit
        uses: crazy-max/ghaction-github-runtime@v3

      - name: Build & start infrastructure
        env:
          COMPOSE_BAKE: "true"
        run: pnpm e2e:up

      # No project filter: run the full cross-browser matrix. The chromium-only
      # PR gate lives in the CI workflow's e2e job.
      - name: Run Playwright (full matrix)
        run: pnpm e2e:test

      - name: Dump container logs on failure
        if: failure()
        run: pnpm e2e:logs

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 1

      - name: Upload Playwright traces & artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 1
