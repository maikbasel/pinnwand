project_id = "pinnwand"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173", "http://localhost:5173"]
jwt_expiry = 3600
# Self-serve signup is OFF. Operators add users via Supabase Studio / the admin
# API; existing users then sign in passwordlessly (magic link + OTP).
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = false
# Passwordless: magic link + 6-digit OTP, mirroring the app's sign-in flow.
otp_length = 6
otp_expiry = 3600
